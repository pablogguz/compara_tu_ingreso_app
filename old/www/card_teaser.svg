<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
    <!-- Dark gradient background -->
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#1e293b"/>
            <stop offset="100%" style="stop-color:#0f172a"/>
        </linearGradient>
        <!-- Glowing effect for curve -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#bg)"/>

    <!-- Distribution curve - proper smooth curve -->
    <path d="M0,450 C200,450 400,150 600,150 C800,150 1000,450 1200,450" 
          fill="none" 
          stroke="#58a2ec" 
          stroke-width="8"
          filter="url(#glow)"
          opacity="0.7"/>

    <!-- Question marks -->
    <g font-family="Open Sans" fill="#94a3b8" font-size="32" opacity="0.7">
        <text x="150" y="400">?</text>
        <text x="350" y="250">?</text>
        <text x="600" y="100">?</text>
        <text x="850" y="250">?</text>
        <text x="1050" y="400">?</text>
    </g>

    <!-- Main text -->
    <text x="600" y="200" 
          font-family="Open Sans" 
          font-size="70" 
          font-weight="700" 
          fill="#fff" 
          filter="url(#glow)"
          text-anchor="middle">
        ¿Cuánto ingresa tu hogar?
    </text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
    <!-- App Icon -->
    <g transform="translate(525, 270)">
        <!-- Rounded square background -->
        <rect x="0" y="0" width="150" height="150" rx="22" fill="#58a2ec" />
        <!-- Distribution curve -->
        <path d="M15 120 Q52.5 30 75 75 Q97.5 120 135 120" 
              fill="none" 
              stroke="#ffffff" 
              stroke-width="8" 
              filter="url(#glow)"
              stroke-linecap="round" />
    </g>

    <!-- Website URL -->
    <text x="600" y="470" 
          font-family="Open Sans" 
          font-size="40" 
          fill="#ffffff" 
          text-anchor="middle">
        comparatuingreso.es
    </text>
</svg>
    <!-- Subtitle split into two lines -->
    <text x="600" y="540" 
          font-family="Open Sans" 
          font-size="40" 
          fill="#94a3b8" 
          text-anchor="middle">
        Descubre tu posición en la
    </text>
    <text x="600" y="590" 
          font-family="Open Sans" 
          font-size="40" 
          fill="#94a3b8" 
          text-anchor="middle">
        distribución de ingresos en España
    </text>
</svg>